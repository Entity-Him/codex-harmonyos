# Codex on HarmonyOS 配置模板 —— 由 codex-harmonyos 提供
# 默认模型: DeepSeek V4 Flash（直连 api.deepseek.com，Responses API）
model = "deepseek-v4-flash"
model_provider = "deepseek"

[model_providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"

